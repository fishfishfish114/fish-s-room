<!DOCTYPE html>

</head>
<body>
    <script>
       let arr = [[1, [2, 3], 4], [5, [6, 7], 8, 9]];
       function ab(array){
        const a=array.reduce((newarr,item)=>{
            if(Array.isArray(item)){
                return newarr.concat(ab(item));
            }
            else{
                return newarr.concat(item);
            }
        },[]);
        return a;
       }
       console.log(ab(arr));
    </script>
</body>
